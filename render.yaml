services:
  # -------------------------------------------------------------
  # Backend: FastAPI + PyTorch (CPU) + Google Gemini AI
  # -------------------------------------------------------------
  - type: web
    name: farmguardian-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GEMINI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # Frontend: React + Vite + TypeScript (Single Page App)
  # -------------------------------------------------------------
  - type: web
    name: farmguardian-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
